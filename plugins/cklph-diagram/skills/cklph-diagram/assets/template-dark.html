<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* ------------------------------------------------------------------
       BRAND TOKENS -- replace this whole :root block with the output of:

           python3 scripts/brand-tokens.py <slug>            # light
           python3 scripts/brand-tokens.py <slug> --mode dark

       The block below is the `_default` neutral skin so this template renders
       standalone. Do not hand-edit these values for a client -- resolve the
       brand (SKILL.md section 0) and paste, so the a11y lint can verify what
       actually shipped.
       ------------------------------------------------------------------ */
    :root {
      --font-display: "Instrument Serif", Georgia, serif;
      --font-mono: "Geist Mono", monospace;
      --font-sans: Geist, system-ui, sans-serif;
      --paper: #1a1917;
      --paper-2: #26241f;
      --ink: #f7f5f2;
      --ink-2: #c8d2e0;
      --muted: #a8a29b;
      --soft: #c9c4bd;
      --rule: rgba(247,245,242,0.16);
      --rule-solid: #6f6a63;
      --accent: #e08a6a;
      --accent-tint: rgba(224,138,106,0.14);
      --link: #8fb4d6;
      --cat-1: #c8d2e0;
      --cat-2: #d9b478;
      --cat-3: #8fb4d6;
      --cat-4: #e08a6a;
      --cat-5: #c9c4bd;
      --seq-1: #22303f;
      --seq-2: #33506a;
      --seq-3: #4f7396;
      --seq-4: #7f9bb8;
      --seq-5: #b3c6d8;
      --seq-6: #e2eaf2;
      --div-neg-2: #e08a6a;
      --div-neg-1: #a8543a;
      --div-mid: #4a4642;
      --div-pos-1: #6f90b0;
      --div-pos-2: #c8d8e8;
    }

    @media (prefers-contrast: more) {
      :root {
        --paper: #000000;
        --ink: #ffffff;
        --muted: #ffffff;
        --soft: #ffffff;
        --rule: rgba(255,255,255,0.55);
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">[Type] · Diagram Design</p>
    <h1>[Diagram title]</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc">
      <title id="[diagram-slug]-title">[Diagram title]</title>
      <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>

        <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#dots)"/> after the paper rect to enable. -->
        <!--
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.08)"/>
        </pattern>
        -->
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Draw arrows first, then nodes. Replace with your content. -->

    </svg>
  </div>
</body>
</html>

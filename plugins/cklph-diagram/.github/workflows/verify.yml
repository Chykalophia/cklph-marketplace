name: verify

# Accessibility that is only checked by hand is accessibility that ships broken
# the first time someone is in a hurry. This runs the same script a developer
# runs locally -- ./scripts/verify.sh -- so a green check and a green terminal
# mean the same thing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # test-tools.py checks that GIF and MP4 exports animate, which needs
      # ffmpeg. The runner image does not ship it, so verify.sh failed there.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Brand audits, renders, a11y lint, refusal path
        run: ./scripts/verify.sh

      - name: Upload rendered proofs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rendered-diagrams
          path: out/
          if-no-files-found: error

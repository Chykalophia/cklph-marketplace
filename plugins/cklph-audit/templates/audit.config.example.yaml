version: 1
units:
  autoInfer: true               # scout infers units (set false to require `list`)
  deepMapThreshold: 0.7         # overall confidence below this → escalate to audit-unit-mapper
  list:                         # optional explicit units; ALWAYS win over inference when present
    - key: auth
      title: Authentication & authorization
      # include the framework's edge/middleware entrypoint — Next.js ≤15 `middleware.ts`
      # OR Next.js 16+ `proxy.ts` (root or `src/`); it's usually the highest-value auth file.
      globs: ["lib/auth/**", "app/api/auth/**", "middleware.ts", "proxy.ts", "src/middleware.ts", "src/proxy.ts"]
    - key: billing
      globs: ["app/api/billing/**", "app/api/payments/**", "lib/stripe/**"]
lenses: [security, correctness, architecture]   # also: sca, iac, container, k8s, supply-chain, compliance, concurrency, state-machine, economic, docs-drift (audits the rulesFrom docs), omission (negative-space: missing validation/error-path/logging)
severityFloor: low              # drop findings below this
verify:
  voters: 3                     # refuters per finding
  passThreshold: majority       # majority | unanimous
  maxVerifierAgents: 400        # cap on total verifier spawns (main + variant) — bounds the fan-out so a
                                # findings-heavy repo can't blow the runtime's 1000-agent cap. Overflow
                                # findings are DEFERRED (unverified) and surfaced, never dropped. Raise for
                                # more coverage on huge repos; lower (or lower `voters`) if you hit the cap.
riskRouting:                    # T1.4: verifier depth scales with a unit's riskScore
  enabled: true
  highThreshold: 0.7            # riskScore ≥ this → +highVotersDelta voters (+ effort high)
  lowThreshold: 0.4             # riskScore ≤ this → +lowVotersDelta voters (floored at 1)
  highVotersDelta: 2
  lowVotersDelta: -1
recon:
  enabled: true                 # per-lens recon: denominators + seeds + safe controls
  quick: false                  # true = recon in :quick mode too (default: quick skips it)
map:                            # T2.1: threat-model phase — trust boundaries, invariants, crown jewels
  enabled: true                 # false or :quick mode → skipped (flagged in report appendix)
variant:                        # T1.1: sibling hunt on each confirmed critical/high (Project Zero)
  enabled: true                 # false or :quick mode → skipped (flagged in appendix)
  maxSeeds: 8                   # cap on confirmed critical/high findings seeded
  maxPerSeed: 20                # cap on siblings hunted per seed
models:                         # per-stage routing: mechanical work ↓, judgment inherits, verify ↑
  # model: sonnet|opus|haiku|fable · effort: low|medium|high|xhigh|max
  # omit a stage (or the whole block) = inherit the session model — safest default
  scout: { effort: low }        # fast unit inference — cheap by design
  recon: { effort: low }        # mechanical enumeration — counts, not judgment
  rulebook: { effort: low }     # doc parsing
  modeler: {}                   # threat model (Map phase) — judgment; inherit
  reviewer: {}                  # judgment — inherit; bump model/effort for hard repos
  verifier: { effort: high }    # the precision bet — never cheap out here
  unitMapper: {}                # escalation path — exists because the cheap pass failed; inherit
  synthesizer: {}               # report writing — inherit
positiveControls:
  max: 15                       # cap on "checked and clean" INFO entries (0 disables)
budget:
  total: 800000                 # advisory — NOT yet enforced by the engine; the Workflow runtime has its own token ceiling (null = unbounded)
quick:
  topN: 5                       # units sampled in :quick mode
ignore: ["**/__tests__/**", "**/*.generated.ts", "types/database.ts"]
report:
  dir: audits
rulesFrom: ["CLAUDE.md", "AGENTS.md", ".coderabbit.yaml"]   # repo rules to honor
# ── v1.0 comprehensive security suite extensions ─────────────────────────────
dast:                            # dynamic testing — opt-in, OFF by default (breaks read-only)
  enabled: false                 # set true to boot the app and run ZAP/Nuclei/ffuf against it
  sandbox: docker                # docker (Docker-in-Docker) | local (local dev server)
  target: auto                   # auto (detect from docker-compose) | a URL like http://localhost:3000
  tools: [zap, nuclei, ffuf]     # which DAST tools to run
  exploitVerify: true            # generate + run PoC exploits for confirmed critical/high
patch:                           # patch generation + validation — opt-in, auto-on when DAST is on
  enabled: false                 # set true to generate, test, and validate patches
  maxIterations: 3               # max patch-and-test rounds per finding
selfReview:                      # adversarial self-review of the report (the "check itself" loop)
  enabled: true                  # default true in full mode, false in quick
  maxRounds: 2                   # cap on re-scan rounds (gaps → re-scan → re-review)
feedRefresh:                     # vulnerability feed freshness
  maxAgeHours: 24                # warn if CVE DB is older than this
  autoRefresh: true              # auto-run refresh at audit start if stale
  sources: [nvd, ghsa, osv]      # CVE feeds to check
compliance:                      # compliance cross-mapping (NOT HIPAA)
  frameworks: [soc2, casa]       # SOC 2 Trust Services Criteria + CASA
ensemble:                        # diverse-model panels for crown-jewel units (T3.4)
  enabled: false                 # expensive — gate to highest-risk units only
  models: []                     # e.g. ["claude-sonnet", "gpt-4o", "gemini-2.5-flash"]
  riskGate: 0.8                  # only units with riskScore ≥ this get ensemble panels
vulnIntel:                       # MCP vulnerability intelligence integration
  enabled: auto                  # auto (default — use cve-mcp/vuln-intel-ext if available, fall back to local tools) | true | false
  # When enabled, the SCA lens will attempt to use MCP tools for enrichment:
  #   - vuln-intel-ext: diff_since (delta CVEs since last scan), save_dependency_snapshot, feed_status, wp_scan
  #   - cve-mcp: cve_enrich (EPSS/KEV/exploit-availability), cve_prioritize (risk ranking), osv_query, exploit_search
  # Install: claude plugin install vuln-intel-ext@cklph  |  npx cve-mcp (configure in MCP client)
  # If MCP tools are not available, the SCA lens proceeds with local CLI tools only (Trivy/Grype/Syft/OSV-Scanner).
